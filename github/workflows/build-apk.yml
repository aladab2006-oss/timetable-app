name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Prepare www folder
        run: mkdir -p www && cp index.html bell.wav www/
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Allow audio autoplay
        run: |
          F=android/app/src/main/java/com/timetable/app/MainActivity.java
          cat > $F <<'JAVA'
          package com.timetable.app;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle b) {
              super.onCreate(b);
              getBridge().getWebView().getSettings().setMediaPlaybackRequiresUserGesture(false);
            }
          }
          JAVA
          sed -i 's/^          //' $F
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TimetableApp-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
