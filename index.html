<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جدول الدروس اليومية</title>
<style>
:root{
  --bg:#f5f4ef; --surface:#ffffff; --surface2:#f0eee7; --ink:#1c2230; --muted:#5f6675; --line:#d9d5c9;
  --brand:#1f5f4a; --brand2:#2f7d63; --brand-ink:#ffffff; --accent:#b9791f;
  --bad:#b3261e; --bad-bg:#fbe2df; --warn-bg:#fff2cf; --ok:#1d7a4a; --ok-bg:#e1f3e8; --sel:#e6f1ec;
  --shadow:0 1px 2px rgba(20,30,40,.08),0 4px 14px rgba(20,30,40,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181d; --surface:#1e2229; --surface2:#262b34; --ink:#e9ebef; --muted:#a2a9b6; --line:#343a46;
    --brand:#4aa485; --brand2:#5cb899; --brand-ink:#0e1713; --accent:#e0a24a;
    --bad:#ff8a80; --bad-bg:#4a2724; --warn-bg:#4a3d1c; --ok:#6fd3a0; --ok-bg:#1f3a2c; --sel:#233a31;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#15181d; --surface:#1e2229; --surface2:#262b34; --ink:#e9ebef; --muted:#a2a9b6; --line:#343a46;
  --brand:#4aa485; --brand2:#5cb899; --brand-ink:#0e1713; --accent:#e0a24a;
  --bad:#ff8a80; --bad-bg:#4a2724; --warn-bg:#4a3d1c; --ok:#6fd3a0; --ok-bg:#1f3a2c; --sel:#233a31; --shadow:none;
}
:root[data-theme="vivid"]{
  --bg:#fff3d6; --surface:#ffffff; --surface2:#ffe3f1; --ink:#2a1650; --muted:#6b4d9c; --line:#ffb347;
  --brand:#7a2ff0; --brand2:#ff2d95; --brand-ink:#ffffff; --accent:#ff7a00;
  --bad:#e0003c; --bad-bg:#ffd3df; --warn-bg:#fff176; --ok:#009e5a; --ok-bg:#b9f6d4; --sel:#e4d4ff;
  --shadow:0 2px 6px rgba(122,47,240,.18),0 6px 18px rgba(255,45,149,.14);
}
:root[data-theme="vivid"] .bar{background:linear-gradient(90deg,#7a2ff0,#ff2d95 62%,#ff8a00)}

:root[data-theme="ocean"]{
  --bg:#eaf4fb; --surface:#ffffff; --surface2:#d6eaf8; --ink:#0b2a44; --muted:#4a6b86; --line:#a9cfe8;
  --brand:#0b5fa5; --brand2:#12a4c9; --brand-ink:#ffffff; --accent:#0b8fb5;
  --bad:#c62828; --bad-bg:#fde0e0; --warn-bg:#fff4c2; --ok:#1b7f4b; --ok-bg:#d7f5e3; --sel:#cfe6fa;
  --shadow:0 1px 4px rgba(11,95,165,.15),0 6px 16px rgba(11,95,165,.10);
}
:root[data-theme="ocean"] .bar{background:linear-gradient(90deg,#0b3d6e,#0b5fa5 60%,#12a4c9)}
:root[data-theme="sunset"]{
  --bg:#fff1e6; --surface:#fffdfb; --surface2:#ffe0c7; --ink:#3a1d0c; --muted:#7d5a45; --line:#f3b98a;
  --brand:#c2410c; --brand2:#e8590c; --brand-ink:#ffffff; --accent:#b45309;
  --bad:#b91c1c; --bad-bg:#fee2e2; --warn-bg:#fef3c7; --ok:#15803d; --ok-bg:#dcfce7; --sel:#fde0c2;
  --shadow:0 1px 4px rgba(194,65,12,.18),0 6px 16px rgba(245,158,11,.14);
}
:root[data-theme="sunset"] .bar{background:linear-gradient(90deg,#7c2d12,#c2410c 55%,#f59e0b)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",Arial,sans-serif;font-size:15px;line-height:1.5}
button,select,input,textarea{font:inherit;color:inherit}
.app{min-height:100vh;display:flex;flex-direction:column}
.bar{background:var(--brand);color:var(--brand-ink);padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bar .logo{height:48px;width:48px;border-radius:8px;object-fit:contain;background:#fff;display:none}
.bar h1{margin:0;font-size:19px;font-weight:700}
.bar .sub{font-size:13px;opacity:.85}
.bar .grow{flex:1}
.bar .tbtn{background:rgba(255,255,255,.16);border:0;border-radius:8px;padding:6px 10px;cursor:pointer;color:inherit}
.nav{background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 12px;overflow-x:auto;position:sticky;top:0;z-index:20}
.nav button{background:none;border:0;border-bottom:3px solid transparent;padding:11px 14px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:600}
.nav button:hover{color:var(--ink)}
.nav button.on{color:var(--brand);border-bottom-color:var(--brand)}
main{padding:16px 18px 40px;flex:1}
h2{margin:0 0 4px;font-size:18px}
.hint{color:var(--muted);font-size:13.5px;margin:0 0 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow);margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{background:var(--brand2)}
.btn.dng{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.summary{background:var(--surface2);border-radius:10px;padding:9px 12px;font-size:14px;display:flex;flex-wrap:wrap;gap:6px 18px;margin:10px 0}
.summary b{font-variant-numeric:tabular-nums}
.summary .bad{color:var(--bad)} .summary .ok{color:var(--ok)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-height:calc(100vh - 250px)}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{border-bottom:1px solid var(--line);border-inline-start:1px solid var(--line);padding:3px 5px;text-align:center;vertical-align:middle;font-size:13.5px}
thead th{background:var(--surface2);position:sticky;top:0;z-index:5;font-weight:700}
thead tr:nth-child(2) th{top:31px}
tbody tr:hover td{background:var(--sel)}
td.l,th.l{text-align:start}
td.day{font-weight:700;background:var(--surface2);position:sticky;inset-inline-start:0;z-index:3}
.grid select{width:100%;min-width:78px;border:1px solid transparent;background:transparent;padding:2px 1px;border-radius:5px;font-size:13px;text-overflow:ellipsis}
.grid select:hover,.grid select:focus{border-color:var(--line);background:var(--surface)}
.grid td.cs{border-inline-start:2px solid var(--line)}
.grid td.v{background:var(--bad-bg)!important}
.grid td.v select{color:var(--bad);font-weight:700}
.grid tr.dayend td{border-bottom:2px solid var(--muted)}
input[type=text],input[type=number],input[type=time],select.f,textarea{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 8px}
input[type=text].c,input[type=number].c{width:100%;min-width:60px}
input[type=number]{width:80px}
textarea{width:100%;min-height:70px}
.badge{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12.5px;font-weight:700}
.badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.bad{background:var(--bad-bg);color:var(--bad)} .badge.warn{background:var(--warn-bg);color:var(--accent)}
.mark{width:42px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;font-weight:800}
.mark.x{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.mark.p{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.view table th,.view table td{padding:10px 8px;font-size:14.5px}
.view .cellS{font-weight:700} .view .cellT{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;align-items:center}
.kv label{color:var(--muted)}
.bell-now{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.logbox{max-height:200px;overflow:auto;font-size:13.5px;background:var(--surface2);border-radius:8px;padding:8px 10px}
.toast{position:fixed;inset-inline:0;bottom:22px;display:flex;justify-content:center;z-index:99;pointer-events:none}
.toast div{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;box-shadow:var(--shadow);max-width:80vw;white-space:pre-line}
.ring{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:120}
.ring.on{display:flex}
#ring{background:none;pointer-events:none;align-items:flex-start;justify-content:flex-start;padding:84px 20px}
#ring .box{pointer-events:auto;border:2px solid var(--brand);padding:16px 22px}
.ring .box{background:var(--surface);border-radius:16px;padding:26px 34px;text-align:center;box-shadow:var(--shadow);max-width:90vw}
.ring .big{font-size:26px;font-weight:800;margin-bottom:8px;color:var(--brand)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:18px 20px;max-width:min(560px,92vw);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 8px}
dialog .msg{white-space:pre-line;margin:6px 0 14px}
.dd{position:relative}.dd summary{list-style:none;cursor:pointer;display:inline-block;user-select:none}.dd summary::-webkit-details-marker{display:none}
.ddm{position:absolute;inset-inline-end:0;top:calc(100% + 4px);z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:6px;min-width:310px;display:flex;flex-direction:column;gap:2px}
.ddm button{background:none;border:0;text-align:start;padding:9px 10px;border-radius:7px;cursor:pointer}.ddm button:hover:not(:disabled){background:var(--surface2)}.ddm button:disabled{opacity:.4;cursor:not-allowed}.ddm .d{color:var(--bad)}
.ddr{padding:6px 10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.ddr input{width:62px}.ddr button{border:1px solid var(--line);background:var(--surface2)}
#printRoot{display:none}
.pg{page-break-after:always;break-after:page;padding:0}
.pg:last-child{page-break-after:auto;break-after:auto}
.pg .ph{display:flex;align-items:center;gap:14px;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:12px}
.pg .ph img{height:64px;max-width:90px;object-fit:contain}
.pg .ph .t1{font-size:22px;font-weight:800} .pg .ph .t2{font-size:15px}
.pg h3{text-align:center;font-size:22px;margin:6px 0 12px}
.pg table{width:100%;border-collapse:collapse;color:#000}
.pg th,.pg td{border:1px solid #000;padding:8px 6px;text-align:center;font-size:15px;background:#fff}
.pg th{background:#e8e8e8}.pg{color:#000}.pg.sp th,.pg.sp td{padding:6px 3px;font-size:12px;height:30px}
.pg .s{font-weight:700}.pg .t{font-size:13px}
.pg .pf{display:flex;justify-content:space-between;margin-top:34px;font-size:15px}
.pg.main th,.pg.main td{font-size:10.5px;padding:2px 3px;line-height:1.25}
.pg.main h3{margin:2px 0 6px;font-size:18px}.pg.main .ph{margin-bottom:6px;padding-bottom:4px}.pg.main .ph img{height:42px}.pg.main .pf{margin-top:10px}
.pg tr{break-inside:avoid}
.pg{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pg table{table-layout:fixed}
.pg .tn{font-size:20px;text-align:center;margin:0 0 10px}
.pg .dt{font-size:28px;font-weight:700;text-align:center;margin:0 0 6px}
.pg.main .dt{font-size:22px;margin:0 0 3px}
.pg.main h3{display:none}
#printRoot .pg{box-sizing:border-box;padding:8mm 10mm}
#printRoot .pg.main th,#printRoot .pg.main td{padding:1px 3px;line-height:1.15}
#printRoot.a3 .pg .dt{font-size:42px}#printRoot.a3 .pg.main .dt{font-size:32px}
/* الجدول الرئيسي: ترويسة أصغر (الشعار بحجمه) وجدول أكبر يملأ الصفحة */
#printRoot .pg.main{padding:5mm 8mm}
#printRoot .pg.main .dt{font-size:16px;margin:0 0 2px}
#printRoot .pg.main .ph{margin-bottom:3px;padding-bottom:3px;gap:10px}
#printRoot .pg.main .ph .t1{font-size:19px;line-height:1.2}
#printRoot .pg.main .ph .t2{font-size:12px;line-height:1.2}
#printRoot .pg.main thead th,#printRoot .pg.main td,#printRoot .pg.main tbody th{font-size:13px}
#printRoot .pg.main tbody tr{height:5.4mm}
#printRoot.a3 .pg.main .dt{font-size:23px}
#printRoot.a3 .pg.main .ph .t1{font-size:27px}
#printRoot.a3 .pg.main .ph .t2{font-size:17px}
#printRoot.a3 .pg.main thead th,#printRoot.a3 .pg.main td,#printRoot.a3 .pg.main tbody th{font-size:18px}
#printRoot.a3 .pg.main tbody tr{height:7.6mm}
@media print{html,body{margin:0!important}}
#printRoot.a3 .pg .tn{font-size:30px}
.pg.main .g{border-right:3px solid #000}
.pg.main tr.ds>*{border-top:3px solid #000}
#printRoot .pg.sp td,#printRoot .pg.sp th{font-size:16px;padding:4px 3px}
#printRoot .pg.sp .t{font-size:14px}
#printRoot .pg.sp tbody tr{height:16mm}
#printRoot.a3 .pg.sp td,#printRoot.a3 .pg.sp th{font-size:24px}
#printRoot.a3 .pg.sp .t{font-size:21px}
#printRoot.a3 .pg.sp tbody tr{height:30mm}
#printRoot.a3 .pg.main td,#printRoot.a3 .pg.main th{font-size:15px}
#printRoot.a3 .pg .ph .t1{font-size:32px}#printRoot.a3 .pg .ph .t2{font-size:22px}#printRoot.a3 .pg h3{font-size:30px}#printRoot.a3 .pg .pf{font-size:22px}
#printRoot.color .pg th{background:#3b4cc0;color:#fff}
#printRoot.color .pg tbody th{background:#ffd54f;color:#000}
@page{size:A4 landscape;margin:10mm}
@media print{
  html,body{background:#fff}
  .app,dialog,.toast,.ring{display:none!important}
  #printRoot{display:block}
}
@media (max-width:700px){main{padding:12px 10px 40px}.kv{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="bar">

    <div><h1 id="barTitle">جدول الدروس الذكي</h1><div class="sub" id="barSub"></div></div>
    <div class="grow"></div>
    <span id="bellChip" class="badge warn" style="display:none"></span>

  <nav class="nav" id="nav"></nav>
  <main id="main"></main>
</div>
<div class="ring" id="ring"><div class="box"><div class="big" id="ringTxt"></div><button class="btn pri" id="ringStop">إيقاف الصوت</button></div></div>

<div id="printRoot"></div>

function norm(s){
  return String(s ?? '').replace(/ /g,' ')
    .replace(/[​-‏‪-‮⁦-⁩﻿ـً-ْ]/g,'')
    .replace(/[آأإ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')

}
function normSubj(s){ return norm(s).replace(/^ال(?=.{2,})/,''); }   // «الرياضيات» = «رياضيات»

let state, blobs = {logo:null, sndStart:null, sndEnd:null};
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function emptyCell(){ return {s:'', t:''}; }
function ensureGrid(){
  const NC = state.classes.length;
  while(state.grid.length < NC) state.grid.push([]);
  state.grid.length = NC;
  for(let c=0;c<NC;c++){
    const g = state.grid[c];
    for(let d=0;d<ND;d++){
      if(!Array.isArray(g[d])) g[d] = [];
      for(let l=0;l<NL;l++){ if(!g[d][l]) g[d][l] = emptyCell(); }
      g[d].length = NL;
    }
    g.length = ND;
  }
}
function subjectIndex(name){ const k = normSubj(name); return state.subjects.findIndex(s => normSubj(s.name) === k); }
function addSubjectIfMissing(name){
  name = String(name||'').trim(); if(!name) return;
  if(subjectIndex(name) < 0) state.subjects.push({name, marks:['','','','','','']});
}
function prepare(st){
  state = st;
  state.settings = Object.assign({school:'', year:'', manager:''}, state.settings||{});
  state.classes = (state.classes||[]).length ? state.classes : ['الأول'];
  state.teachers = state.teachers || []; state.subjects = state.subjects || []; state.assign = state.assign || []; state.advisors = state.advisors || {}; state.staff = Array.isArray(state.staff) ? state.staff : [];
  state.teachers.forEach(t => { t.days = Array.isArray(t.days) && t.days.length===ND ? t.days : [true,true,true,true,true]; t.type = TYPES.includes(t.type) ? t.type : 'ملاك'; });
  state.subjects.forEach(s => { s.marks = Array.isArray(s.marks) ? s.marks.slice(0,NL) : []; while(s.marks.length<NL) s.marks.push(''); });
  state.assign.forEach(a => addSubjectIfMissing(a.subject));
  state.grid = state.grid || [];
  ensureGrid();
  state.grid.forEach(g => g.forEach(day => day.forEach(c => addSubjectIfMissing(c.s))));
  state.timings = state.timings || [];

}

function idb(){ return new Promise((res,rej) => { const r = indexedDB.open('ttapp',1); r.onupgradeneeded = () => r.result.createObjectStore('b'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function bGet(k){ try{ const db = await idb(); return await new Promise(res => { const q = db.transaction('b').objectStore('b').get(k); q.onsuccess = () => res(q.result||null); q.onerror = () => res(null); }); }catch(e){ return null; } }
async function bSet(k,v){ try{ const db = await idb(); await new Promise(res => { const tx = db.transaction('b','readwrite'); if(v==null) tx.objectStore('b').delete(k); else tx.objectStore('b').put(v,k); tx.oncomplete = () => res(); tx.onerror = () => res(); }); }catch(e){} }

}

  const {tm, sm} = lookups(); const NC = state.classes.length;
  const cnt = new Map();
  for(let c=0;c<NC;c++) for(let d=0;d<ND;d++) for(let l=0;l<NL;l++){
    const k = norm(state.grid[c][d][l].t); if(!k) continue;
    const key = k+'|'+d+'|'+l; cnt.set(key, (cnt.get(key)||0)+1);
  }
  const V = [];
  for(let c=0;c<NC;c++){
    V.push([]);
    for(let d=0;d<ND;d++){
      V[c].push([]);
      for(let l=0;l<NL;l++){
        const cell = state.grid[c][d][l]; let bits = 0;
        const tk = norm(cell.t);
        if(tk){
          if(cnt.get(tk+'|'+d+'|'+l) > 1) bits |= 1;
          const te = tm.get(tk);
          if(!te) bits |= 16;
          else{
            if(te.type === 'مفرّغ' || te.days[d] === false) bits |= 2;
            if(parseBanned(te.banned).has(l+1)) bits |= 4;
          }
        }
        if(String(cell.s||'').trim()){
          const sr = sm.get(normSubj(cell.s));
          if(sr && String(sr.marks[l]).toUpperCase() === 'X') bits |= 8;
        }
        V[c][d].push(bits);
      }
    }
  }
  return V;
}
function violationSummary(V){
  let filled = 0, any = 0, conf = 0, unav = 0, bt = 0, bs = 0;
  V.forEach((cd, c) => cd.forEach((ld, d) => ld.forEach((bits, l) => {
    const cell = state.grid[c][d][l];
    if(String(cell.s||'').trim()) filled++;
    if(String(cell.t||'').trim()) filled++;
    if(bits) any++;
    if(bits & 1) conf++;
    if(bits & 2) unav++;
    if(bits & 16) unav++;
    if(bits & 4) bt++;
    if(bits & 8) bs++;
  })));
  return {lessons: Math.round(filled/2), any, conf, unav, bt, bs};
}
function teacherLoad(name){
  const k = norm(name); let n = 0;
  state.grid.forEach(g => g.forEach(day => day.forEach(c => { if(norm(c.t) === k) n++; })));
  return n;
}

/* ================= محلّل التوليد (محاكاة التلدين) ================= */
const MAXIT = 2000000, MAXTRY = 5, OPTIT = 300000;
function buildProblem(complete){
  const NC = state.classes.length, clsNorm = state.classes.map(norm);
  const tl = state.teachers.filter(t => String(t.name||'').trim());
  const nTe = tl.length;
  const teName = [''].concat(tl.map(t => t.name.trim()), ['?']);
  const teNorm = teName.map(norm);
  const T = nTe + 2;
  const avBad = Array.from({length:T}, () => new Array(ND).fill(0));
  const flBad = Array.from({length:T}, () => new Array(NL).fill(0));
  tl.forEach((t,i) => {
    const k = i+1;
    for(let d=0;d<ND;d++) avBad[k][d] = (t.type === 'مفرّغ' || t.days[d] === false) ? 1 : 0;
    parseBanned(t.banned).forEach(n => { flBad[k][n-1] = 1; });
  });
  const teIdx = nm => { const n = norm(nm); if(!n) return 0; for(let i=1;i<=nTe;i++) if(teNorm[i] === n) return i; return 0; };
  const sfRows = state.subjects.map(s => ({name:s.name, nm:normSubj(s.name), bad:s.marks.map(m => String(m).toUpperCase()==='X'?1:0), pref:s.marks.map(m => m==='+'?1:0)}));
  sfRows.forEach(r => { r.hasPref = r.pref.some(x => x); });
  const anyPref = sfRows.some(r => r.hasPref);
  const subjRowOf = nm => { const n = normSubj(nm); if(!n) return 0; for(let i=0;i<sfRows.length;i++) if(sfRows[i].nm === n) return i+1; return 0; };

  const tCls=[0], tTe=[0], tSubj=[''], tRow=[0], tRem=[0], tMax=[0], tMin=[0];
  const hasTask = new Array(NC).fill(false);
  let rowNo = 0;
  for(const a of state.assign){
    rowNo++;
    const cn = String(a.cls||'').trim(), cnt = Math.round(Number(digits(a.count))) || 0;
    if(!cn || !(cnt > 0)) continue;
    const ci = clsNorm.indexOf(norm(cn));
    if(ci < 0) return {error:'الصف «'+cn+'» (السطر '+rowNo+' في «الإسناد») غير موجود في قائمة الصفوف.'};
    const tch = String(a.teacher||'').trim();
    if(!tch) return {error:'اسم المعلم فارغ في السطر '+rowNo+' من «الإسناد» (الصف: '+cn+' - المادة: '+a.subject+').\nاختاروا المعلم أو احذفوا السطر.'};
    const te = teIdx(tch);
    if(!te) return {error:'المعلم «'+tch+'» (السطر '+rowNo+' في «الإسناد») غير مسجَّل في «المعلمون».'};
    if(avBad[te].reduce((x,y)=>x+y,0) >= ND) return {error:'المعلم «'+tch+'» مفرَّغ أو غير متاح بأي يوم، ولا يمكن توزيع دروس له.'};
    tCls.push(ci); tTe.push(te); tSubj.push(String(a.subject||'').trim()); tRow.push(subjRowOf(a.subject));
    tRem.push(cnt); tMax.push(Math.ceil(cnt/ND)); tMin.push(Math.floor(cnt/ND));
    hasTask[ci] = true;
  }
  if(tCls.length === 1) return {error:'ورقة «الإسناد» فارغة. أدخلوا الصف والمادة وعدد الدروس والمعلم.'};
  const load = new Array(nTe+2).fill(0); for(let i=1;i<tCls.length;i++) load[tTe[i]] += tRem[i];
  const over = [];
  for(let k=1;k<=nTe;k++){
    if(!load[k]) continue;
    const cap = (ND - avBad[k].reduce((x,y) => x+y, 0)) * (NL - flBad[k].reduce((x,y) => x+y, 0));
    if(load[k] > cap) over.push('«'+teName[k]+'»: مُسند له '+load[k]+' درساً أسبوعياً، وأوقاته المتاحة '+cap+' فقط');
  }
  if(over.length) return {error:'بعض المعلمين مُسند لهم دروس أكثر مما تسمح به أوقاتهم:\n'+over.slice(0,8).join('\n')+(over.length>8?'\n… و'+(over.length-8)+' آخرون':'')+'\n\nغيّروا المعلم في بعض أسطر «الإسناد» (مثلاً معلم مختلف لكل شعبة).'};

  const grid = Array.from({length:NC}, () => Array.from({length:ND}, () => new Array(NL).fill(0)));
  const fixedC = Array.from({length:NC}, () => Array.from({length:ND}, () => new Array(NL).fill(false)));
  const mv = Array.from({length:NC}, () => []);
  const ext = [];
  for(let c=0;c<NC;c++) for(let d=0;d<ND;d++) for(let l=0;l<NL;l++){
    const cell = state.grid[c][d][l], subj = String(cell.s||'').trim(), tch = String(cell.t||'').trim();
    if(!hasTask[c]){ if(tch){ ext.push([teIdx(tch) || nTe+1, d, l]); } continue; }
    if(complete && subj && tch){
      let k = 0;
      for(let i=1;i<tCls.length;i++) if(tCls[i]===c && normSubj(tSubj[i])===normSubj(subj) && teNorm[tTe[i]]===norm(tch)){ k = i; break; }
      if(k > 0) tRem[k]--;
      else{ k = tCls.length; tCls.push(c); tTe.push(teIdx(tch) || nTe+1); tSubj.push(subj); tRow.push(subjRowOf(subj)); tRem.push(0); tMax.push(9); tMin.push(0); }
      grid[c][d][l] = k; fixedC[c][d][l] = true;
    }else mv[c].push([d,l]);
  }
  const skipped = [];
  for(let c=0;c<NC;c++){
    if(!hasTask[c]){ skipped.push(state.classes[c]); continue; }
    let sum = 0; for(let i=1;i<tCls.length;i++) if(tCls[i]===c) sum += tRem[i];
    if(sum !== mv[c].length) return {error:'مجموع دروس الصف «'+state.classes[c]+'» ('+sum+') لا يساوي عدد الخانات المطلوب تعبئتها ('+mv[c].length+'). صحِّحوا «الإسناد».'};
  }
  return {NC, nTe, T, teName, avBad, flBad, sfRows, anyPref, tCls, tTe, tSubj, tRow, tRem, tMax, tMin, hasTask, grid, fixedC, mv, ext, skipped, nT: tCls.length-1};
}

async function solveProblem(P, progress){
  const {NC, T, avBad, flBad, sfRows, tTe, tRow, tRem, tMax, tMin, grid, fixedC, mv, ext, nT, tCls} = P;
  const ct = new Int16Array(T*ND*NL), cd = new Int16Array((nT+1)*ND);
  const ci = (t,d,l) => (t*ND+d)*NL+l;
  const local = (k,d,l) => { const t = tTe[k]; let r = avBad[t][d] + flBad[t][l]; const sr = tRow[k]; if(sr>0) r += sfRows[sr-1].bad[l]; return r; };
  const addT = (k,d,l) => { const t = tTe[k], i = ci(t,d,l); let r = local(k,d,l); if(ct[i]>0) r++; if(cd[k*ND+d] >= tMax[k]) r++; ct[i]++; cd[k*ND+d]++; return r; };
  const remT = (k,d,l) => { const t = tTe[k], i = ci(t,d,l); ct[i]--; cd[k*ND+d]--; let r = local(k,d,l); if(ct[i]>0) r++; if(cd[k*ND+d] >= tMax[k]) r++; return r; };
  const prefCost = (k,l) => { const rw = tRow[k]; if(rw>0){ const s = sfRows[rw-1]; if(s.hasPref && !s.pref[l]) return 1; } return 0; };
  const gapT = (t,d) => { let first=-1,last=-1,n=0; for(let l=0;l<NL;l++) if(ct[ci(t,d,l)]>0){ if(first<0) first=l; last=l; n++; } return n ? (last-first+1)-n : 0; };
  const defT = (k,d) => cd[k*ND+d] < tMin[k] ? tMin[k]-cd[k*ND+d] : 0;
  const totalGaps = () => { let s=0; for(let t=1;t<T;t++) for(let d=0;d<ND;d++) s += gapT(t,d); return s; };
  const totalDef = () => { let s=0; for(let k=1;k<=nT;k++) for(let d=0;d<ND;d++) s += defT(k,d); return s; };
  const totalPref = () => { let s=0; for(let c=0;c<NC;c++) for(let d=0;d<ND;d++) for(let l=0;l<NL;l++) if(grid[c][d][l]>0) s += prefCost(grid[c][d][l], l); return s; };
  const stats = {};

  async function optimize(){
    stats.gapsBefore = totalGaps(); stats.prefBefore = totalPref(); stats.defBefore = totalDef();
    for(let it=1; it<=OPTIT; it++){
      const c = Math.floor(Math.random()*NC), m = mv[c];
      if(m.length >= 2){
        const ia = Math.floor(Math.random()*m.length), ib = Math.floor(Math.random()*m.length);
        if(ia !== ib){
          const [da,la] = m[ia], [db,lb] = m[ib];
          const ka = grid[c][da][la], kb = grid[c][db][lb];
          if(ka !== kb){
            const pairs = [];
            const addPair = (t,d) => { for(const p of pairs) if(p[0]===t && p[1]===d) return; pairs.push([t,d]); };
            addPair(tTe[ka],da); addPair(tTe[ka],db); addPair(tTe[kb],da); addPair(tTe[kb],db);
            let gb = 0; for(const p of pairs) gb += gapT(p[0],p[1]);
            const kds = [];
            const addKD = (k,d) => { for(const p of kds) if(p[0]===k && p[1]===d) return; kds.push([k,d]); };
            addKD(ka,da); addKD(ka,db); addKD(kb,da); addKD(kb,db);
            let fb = 0; for(const p of kds) fb += defT(p[0],p[1]);
            const pb = prefCost(ka,la) + prefCost(kb,lb);
            let h = -remT(ka,da,la) - remT(kb,db,lb);
            h += addT(kb,da,la) + addT(ka,db,lb);
            let ga = 0; for(const p of pairs) ga += gapT(p[0],p[1]);
            let fa = 0; for(const p of kds) fa += defT(p[0],p[1]);
            const pa = prefCost(kb,la) + prefCost(ka,lb);
            const soft = (ga-gb) + 2*(pa-pb) + 10*(fa-fb);
            if(h <= 0 && soft <= 0){ grid[c][da][la] = kb; grid[c][db][lb] = ka; }
            else{ remT(kb,da,la); remT(ka,db,lb); addT(ka,da,la); addT(kb,db,lb); }
          }
        }
      }
      if(it % 60000 === 0){ progress('تحسين الجدول… '+Math.round(it*100/OPTIT)+'%'); await tick(); }
    }
    stats.gapsAfter = totalGaps(); stats.prefAfter = totalPref(); stats.defAfter = totalDef();
  }

  for(let tries=1; tries<=MAXTRY; tries++){
    ct.fill(0); cd.fill(0);
    let cost = 0;
    for(let c=0;c<NC;c++) for(let d=0;d<ND;d++) for(let l=0;l<NL;l++) if(fixedC[c][d][l]) cost += addT(grid[c][d][l], d, l);
    for(const e of ext) ct[ci(e[0],e[1],e[2])]++;
    const baseCost = cost;
    for(let c=0;c<NC;c++){
      const pool = [];
      for(let k=1;k<=nT;k++) if(tCls[k]===c) for(let j=0;j<tRem[k];j++) pool.push(k);
      for(let i=pool.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); const x = pool[i]; pool[i] = pool[j]; pool[j] = x; }
      for(let i=0;i<mv[c].length;i++){ const [d,l] = mv[c][i]; grid[c][d][l] = pool[i]; cost += addT(pool[i], d, l); }
    }
    let temp = 0.6;
    for(let it=1; it<=MAXIT; it++){
      if(cost <= baseCost){ await optimize(); return {ok:true, stats}; }
      const c = Math.floor(Math.random()*NC), m = mv[c];
      if(m.length >= 2){
        const ia = Math.floor(Math.random()*m.length), ib = Math.floor(Math.random()*m.length);
        if(ia !== ib){
          const [da,la] = m[ia], [db,lb] = m[ib];
          const ka = grid[c][da][la], kb = grid[c][db][lb];
          if(ka !== kb){
            let delta = -remT(ka,da,la) - remT(kb,db,lb);
            delta += addT(kb,da,la) + addT(ka,db,lb);
            if(delta <= 0 || Math.random() < Math.exp(-delta/temp)){ grid[c][da][la] = kb; grid[c][db][lb] = ka; cost += delta; }
            else{ remT(kb,da,la); remT(ka,db,lb); addT(ka,da,la); addT(kb,db,lb); }
          }
        }
      }
      temp *= 0.99999; if(temp < 0.15) temp = 0.15;
      if(it % 60000 === 0){ progress('البحث عن توزيع… محاولة '+tries+' من '+MAXTRY+' (التضارب المتبقي: '+(cost-baseCost)+')'); await tick(); }
    }
  }
  return {ok:false, stats};
}

let busy = false;
async function runBuild(complete){
  if(busy) return;
  const P = buildProblem(complete);
  if(P.error){ await ask('تنبيه', P.error); return; }
  busy = true; setBusy(true);
  const t0 = performance.now();
  const prog = m => { $('#busyMsg') && ($('#busyMsg').textContent = m); };
  let res;
  try{ res = await solveProblem(P, prog); }
  catch(e){ busy = false; setBusy(false); await ask('خطأ غير متوقع', String(e && e.message || e)); return; }
  busy = false; setBusy(false);
  if(!res.ok){
    await ask('تعذّر التوزيع', 'لم أتمكن من الوصول إلى توزيع بدون تضارب، ولم يتم تغيير الجدول.\nخففوا القيود (الأيام والدروس الممنوعة، أو عدد دروس المعلم الواحد) ثم أعيدوا المحاولة.');
    return;
  }
  const {NC, grid, mv, tSubj, tRow, tTe, teName, sfRows, anyPref, skipped, hasTask} = P;
  if(!complete) for(let c=0;c<NC;c++) if(hasTask[c]) for(let d=0;d<ND;d++) for(let l=0;l<NL;l++) state.grid[c][d][l] = emptyCell();
  for(let c=0;c<NC;c++) for(const [d,l] of mv[c]){
    const k = grid[c][d][l];
    state.grid[c][d][l] = {s: tRow[k] > 0 ? state.subjects[tRow[k]-1].name : tSubj[k], t: teName[tTe[k]]};
  }
  save(); render();
  const s = res.stats;
  let msg = complete ? 'تم إكمال الدروس الفارغة بدون أي تضارب.' : 'تم توليد الجدول بنجاح وبدون أي تضارب.';
  if(skipped.length) msg += '\nالصفوف التي تم تخطيها لأنه لا يوجد لها إسناد: ' + skipped.join('، ');
  msg += '\nالفراغات بين دروس المعلم في اليوم الواحد: من ' + s.gapsBefore + ' إلى ' + s.gapsAfter;
  msg += '\nالتوزيع العادل لدروس المادة على الأيام: من ' + s.defBefore + ' إلى ' + s.defAfter;
  if(anyPref) msg += '\nدروس المواد خارج الأوقات المفضلة (+): من ' + s.prefBefore + ' إلى ' + s.prefAfter;
  msg += '\nالزمن: ' + ((performance.now()-t0)/1000).toFixed(1) + ' ثانية';
  await ask('جدول الدروس الذكي', msg);
}
function setBusy(on){
  let b = $('#busy');
  if(on){
    if(!b){ b = document.createElement('div'); b.id = 'busy'; b.className = 'ring on'; b.innerHTML = '<div class="box"><div class="big">جارٍ العمل…</div><div id="busyMsg">يرجى الانتظار</div></div>'; document.body.appendChild(b); }

}

function refreshTeacherComputed(){
  let reg = 0, away = 0;
  document.querySelectorAll('#tt tbody tr').forEach(tr => {

    const n = nm ? teacherLoad(nm) : '';
    let st = '', cls = 'ok';
    if(nm){
      if(t.type === 'مفرّغ' && n > 0){ st = 'مفرّغ وعليه دروس'; cls = 'bad'; }
      else if(t.max !== '' && n > t.max){ st = 'تجاوز النصاب'; cls = 'bad'; }
      else st = 'سليم';

    tr.querySelector('.ld').textContent = n;
    tr.querySelector('.st').innerHTML = st ? '<span class="badge '+cls+'">'+st+'</span>' : '';
  });
  const s = $('#tsum'); if(s) s.innerHTML = '<span>المعلمون المسجلون: <b>'+reg+'</b></span><span>المفرّغون (يُستثنون): <b>'+away+'</b></span><span>المتاحون للتوزيع: <b>'+(reg-away)+'</b></span>';

    h += '</tr>';
  }

function teacherTable(name){
  const k = norm(name); let h = '<table><thead><tr><th>اليوم</th>'+LESS.map(l => '<th>الدرس '+l+'</th>').join('')+'</tr></thead><tbody>'; let n = 0;
  for(let d=0;d<ND;d++){
    h += '<tr><td class="day">'+DAYS[d]+'</td>';

      const hits = []; state.grid.forEach((g,c) => { const x = g[d][l]; if(norm(x.t) === k) hits.push('<div class="s cellS">'+esc(state.classes[c])+'</div><div class="t cellT">'+esc(x.s)+'</div>'); });
      n += hits.length; h += '<td>'+hits.join('<hr style="border:0;border-top:1px dashed #999;margin:3px 0">')+'</td>';

/* ---------- الشعب (أ، ب، ج …) ---------- */
const SEC = ['أ','ب','ج','د','هـ','و','ز','ح','ط','ي'];
function baseOf(name){ const m = new RegExp('^(.*\\S)\\s+('+SEC.join('|')+')$').exec(String(name).trim()); return m ? {base:m[1], hasL:true} : {base:String(name).trim(), hasL:false}; }
function renameClass(i, nv){ const old = state.classes[i]; state.assign.forEach(a => { if(norm(a.cls) === norm(old)) a.cls = nv; }); state.classes[i] = nv; if(state.advisors && state.advisors[old] != null){ state.advisors[nv] = state.advisors[old]; delete state.advisors[old]; } }
function sortAssignAll(){ const ix = a => { const i = state.classes.findIndex(c => norm(c) === norm(a.cls)); return i < 0 ? 99 : i; }; state.assign = state.assign.map((a,i) => [a,i]).sort((x,y) => ix(x[0]) - ix(y[0]) || x[1] - y[1]).map(x => x[0]); }
function addSections(i, total, copy){
  const used = n => state.classes.some(c => norm(c) === norm(n));
  let {base, hasL} = baseOf(state.classes[i]);
  if(!hasL){ const nn = base + ' ' + SEC[0]; if(used(nn)){ toast('الاسم «'+nn+'» موجود أصلاً.'); return; } renameClass(i, nn); }
  const srcName = state.classes[i];
  const inBase = c => { const b = baseOf(c); return b.hasL && norm(b.base) === norm(base); };
  const sections = state.classes.filter(inBase).length;
  if(total == null) total = sections + 1;
  const need = total - sections; if(need <= 0){ toast('عدد شعب «'+base+'» الحالي '+sections+' أصلاً.'); return; }
  let pos = i; while(pos+1 < state.classes.length && inBase(state.classes[pos+1])) pos++;
  const src = copy === false ? [] : state.assign.filter(a => norm(a.cls) === norm(srcName)).map(a => Object.assign({}, a)), added = [];
  for(let k=0;k<need;k++){
    let li = 0; while(li < SEC.length && used(base+' '+SEC[li])) li++; if(li >= SEC.length) break;
    const nm = base+' '+SEC[li]; state.classes.splice(pos+1, 0, nm); state.grid.splice(pos+1, 0, []); pos++;
    src.forEach(a => state.assign.push(Object.assign({}, a, {cls: nm}))); added.push(nm);
  }
  ensureGrid(); sortAssignAll(); save(); render();
  toast('تمت الإضافة: '+added.join('، ')+(src.length ? '\nنُسخ إسناد «'+srcName+'» إليها بمعلميه نفسهم. إذا كان لكل شعبة معلمون مختلفون فغيّروهم من تبويب «الإسناد» (المعلم الواحد لا يتسع لأكثر من 30 درساً).' : '\nأكملوا إسنادها من تبويب «الإسناد».'), 7000);
}

function shiftBits(d){ const v = String(state.shifts[d]||''); return v.includes('بدون') ? 0 : v.includes('كلا') ? 3 : v.includes('صباح') ? 1 : v.includes('مسائ') ? 2 : 3; }
function rowApplies(name, sh){
  const isM = name.includes('صباح'), isE = name.includes('مسائ') || name.includes('عصر');
  if(!isM && !isE) return sh !== 0;
  return isM ? (sh & 1) === 1 : (sh & 2) === 2;
}
const hm = s => { const m = /^(\d{1,2}):(\d{2})/.exec(String(s||'')); return m ? [+m[1], +m[2]] : null; };
function todayEvents(now){
  const wd = now.getDay(); if(wd > 4) return [];
  const sh = shiftBits(wd), map = new Map();
  state.timings.forEach(r => {
    const nm = String(r.name||'').trim(); if(!rowApplies(nm, sh)) return;
    const isBreak = nm.includes('الفرصة');
    [['start', r.start], ['end', r.end]].forEach(([col, v]) => {
      const t = hm(v); if(!t) return;
      const at = new Date(now.getFullYear(), now.getMonth(), now.getDate(), t[0], t[1], 0);
      const key = at.getTime();
      const e = map.get(key) || {t: at, msgs: [], startSnd: false, endSnd: false, fired: false};
      e.msgs.push((col === 'start' ? 'بداية ' : 'نهاية ') + nm);
      const sound = col === 'start' ? (isBreak ? 'end' : 'start') : (isBreak ? 'start' : 'end');
      if(sound === 'start') e.startSnd = true; else e.endSnd = true;

function playSound(kind){   // kind: 'start' | 'end'

  let stopped = false, timer, nodes = [], audio;
  const stop = () => { if(stopped) return; stopped = true; clearTimeout(timer); nodes.forEach(n => { try{ n.stop(); }catch(e){} }); if(audio){ audio.pause(); URL.revokeObjectURL(audio.src); } bell.playing = null; $('#ring').classList.remove('on'); };
  if(blob){
    audio = new Audio(URL.createObjectURL(blob)); audio.onended = stop; audio.play().catch(() => { stop(); toast('تعذّر تشغيل ملف الصوت.'); });
    if(dur > 0) timer = setTimeout(stop, dur*1000);

    const c = audioCtx(), t0 = c.currentTime + .05, base = kind === 'start' ? 880 : 659, strikes = kind === 'start' ? 3 : 2, gap = 1.15;

}

async function hashPin(p){
  const s = 'ttapp|' + String(p).trim();
  try{
    if(window.crypto && crypto.subtle){
      const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
      return Array.from(new Uint8Array(d)).map(b => b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  let x = 5381; for(const ch of s) x = ((x << 5) + x + ch.charCodeAt(0)) | 0; return 'f' + x;
}
function pinDialog(title, msg){
  return new Promise(res => {
    const ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center';
    ov.innerHTML = '<div style="background:var(--surface);color:var(--ink);border-radius:12px;padding:18px;min-width:300px;max-width:92vw;box-shadow:0 10px 40px rgba(0,0,0,.35)"><h2 style="margin:0 0 6px;font-size:17px"></h2><p class="hint" style="margin:0 0 10px"></p><input type="password" autocomplete="off" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--surface2)"><div class="row" style="margin-top:12px"><button class="btn pri" data-ok>موافق</button><button class="btn" data-no>إلغاء</button></div></div>';
    ov.querySelector('h2').textContent = title; ov.querySelector('p').textContent = msg;
    document.body.appendChild(ov);
    const inp = ov.querySelector('input'); inp.focus();
    const done = v => { ov.remove(); res(v); };
    ov.querySelector('[data-ok]').onclick = () => done(inp.value);
    ov.querySelector('[data-no]').onclick = () => done(null);
    inp.onkeydown = e => { if(e.key === 'Enter') done(inp.value); else if(e.key === 'Escape') done(null); };
  });
}
async function setPinFlow(){
  const a = await pinDialog('رقم سري جديد', 'اكتبوا رقماً سرياً (4 رموز على الأقل). سيُطلب لفتح التعديل.');

}

  try{ const th = localStorage.getItem('ttapp.theme'); if(th) document.documentElement.dataset.theme = th; }catch(e){}
  const THEMES = ['light','dark','vivid','ocean','sunset'], TNAME = {light:'فاتح', dark:'داكن', vivid:'زاهٍ', ocean:'بحري', sunset:'غروب'};
  const curTheme = () => document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const showTheme = () => { $('#themeBtn').textContent = '◐ المظهر: ' + TNAME[curTheme()]; };
  $('#themeBtn').onclick = () => {
    const nt = THEMES[(THEMES.indexOf(curTheme()) + 1) % THEMES.length]; document.documentElement.dataset.theme = nt;
    try{ localStorage.setItem('ttapp.theme', nt); }catch(e){} showTheme();
  };
  showTheme();
  $('#ringStop').onclick = stopSound;
  state = loadState();
  locked = !!(state.settings && state.settings.pin);
  $('#lockBtn').onclick = lockBtnClick;
  resetIdle();
  blobs.logo = await bGet('logo'); blobs.sndStart = await bGet('sndStart'); blobs.sndEnd = await bGet('sndEnd'); try{ if(!blobs.sndStart) blobs.sndStart = await (await fetch('/bell.wav')).blob(); if(!blobs.sndEnd) blobs.sndEnd = await (await fetch('/bell.wav')).blob(); }catch(e){}
  window.addEventListener('beforeunload', e => { if(bell.running && !state.bell.auto){ e.preventDefault(); e.returnValue = ''; } });
  render();
  if(state.bell.auto){ bellStart(true); toast('الجرس يعمل تلقائياً. اتركوا النافذة مفتوحة (يمكن تصغيرها).', 4500); }
})();
</script>
<script>
/* جسر الأندرويد: حفظ/مشاركة الملفات بدل التنزيل العادي (النسخة الاحتياطية، التصدير) */
(function(){
  var C=window.Capacitor; if(!C||!C.isNativePlatform||!C.isNativePlatform())return;
  function save(a){
    var name=(a.download||'file').replace(/[\\/:*?"<>|]/g,'_'), P=C.Plugins;
    fetch(a.href).then(function(r){return r.blob()}).then(function(b){return new Promise(function(ok){
      var fr=new FileReader(); fr.onload=function(){ok(String(fr.result).split(',')[1])}; fr.readAsDataURL(b);
    })}).then(function(d){return P.Filesystem.writeFile({path:name,data:d,directory:'CACHE'})})
      .then(function(r){return P.Share.share({title:name,url:r.uri})})
      .catch(function(e){ if(e&&/cancel/i.test(String(e.message||e)))return; alert('تعذّر حفظ الملف: '+(e&&e.message||e)); });
  }
  var orig=HTMLAnchorElement.prototype.click;
  HTMLAnchorElement.prototype.click=function(){ if(this.hasAttribute('download')){save(this);return;} return orig.apply(this,arguments); };
  document.addEventListener('click',function(e){ var a=e.target.closest&&e.target.closest('a[download]'); if(a){e.preventDefault();e.stopPropagation();save(a);} },true);
})();
</script>
